[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent"
version = "0.1.0"
description = "Multi-tenant RAG agent backend with intent routing and tool-calling"
requires-python = ">=3.11"
# Runtime dependencies live in requirements.txt.
# Install the package in editable mode first: pip install -e .
# Then install deps: pip install -r requirements.txt

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
